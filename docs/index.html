<style>
#orgfoot a{color:inherit}

button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 70px}
.top{display:flex;align-items:center;gap:11px;margin:4px 0 16px}
.sunlogo{width:38px;height:38px;border-radius:11px;background:radial-gradient(circle at 50% 120%,var(--sun) 0 38%,var(--dawn) 39% 58%,#3a1d5c 59%);flex:none;position:relative;overflow:hidden}
.top h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.015em}
.top small{display:block;color:var(--mute);font-size:12px;font-weight:500}
.top .me{margin-left:auto;font-size:12px;color:var(--mute);text-align:right;background:none;border:0;padding:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(160deg,#2a1838 0%,#3b1f2b 45%,#5a2d18 100%);border:1px solid #4a2b3a}

.btn{display:block;width:100%;border:0;border-radius:13px;padding:15px;font-weight:800;background:var(--sun);color:#24150a;font-size:16px}
.btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:700;font-size:15px}
.btn.ghost{background:none;color:var(--mute);border:0;padding:10px;font-weight:600;font-size:14px}
.btn:disabled{opacity:.45}
.btn + .btn{margin-top:10px}
.row{display:flex;gap:10px}.row>*{flex:1}
.note{color:var(--mute);font-size:13px}
label.f{display:block;font-size:12px;color:var(--mute);font-weight:700;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em}
input.in{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--text);font:inherit;font-size:16px}

.chips{display:flex;flex-wrap:wrap;gap:6px}

.lb{width:100%;border-collapse:collapse;font-size:14px}
.lb td{padding:9px 4px;border-top:1px solid var(--line)}
.lb tr:first-child td{border-top:0}
.lb .rk{width:28px;color:var(--mute);font:700 13px "JetBrains Mono",monospace}
.lb .sc{text-align:right;font:700 14px "JetBrains Mono",monospace;white-space:nowrap}
.lb .nm{font-weight:600}.lb .sub{display:block;color:var(--dim);font-size:11.5px;font-weight:500}
.lb tr.mine td{background:rgba(255,181,71,.08)}
.medal{font-size:15px}
.dots{display:flex;gap:4px;margin-bottom:12px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--panel2)}
.dots i.ok{background:var(--green)}.dots i.no{background:var(--red)}.dots i.cur{background:var(--sun)}
.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:8px;font-weight:600}
.lvl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.lvl.l1{background:#143326;color:var(--green)}.lvl.l2{background:#33270f;color:var(--sun)}.lvl.l3{background:#3a1616;color:var(--red)}
.q{font-size:19px;font-weight:700;line-height:1.35;margin:4px 0 14px;letter-spacing:-.01em}
.clock{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.clock .bar{flex:1;height:8px;background:var(--panel2);border-radius:5px;overflow:hidden}
.clock .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--dawn),var(--sun));border-radius:5px}
.clock .bar.low i{background:var(--red)}
.clock b{font:700 15px "JetBrains Mono",monospace;width:34px;text-align:right}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px;font-size:15.5px}
.opt .l{font:700 14px/1 "JetBrains Mono",monospace;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:#262b34;flex:none;margin-top:-2px}
.opt:disabled{cursor:default}
.opt.pick{border-color:var(--sun);background:#2b2214}.opt.pick .l{background:var(--sun);color:#24150a}
.opt.right{border-color:var(--green);background:#10281e}.opt.right .l{background:var(--green);color:#05140d}
.opt.wrong{border-color:var(--red);background:#2b1515}.opt.wrong .l{background:var(--red);color:#1a0606}
.fb{text-align:center;padding:10px;border-radius:12px;font-weight:800;font-size:18px;margin-top:4px}
.fb.ok{background:#10281e;color:var(--green)}.fb.no{background:#2b1515;color:var(--red)}
.fb small{display:block;font-weight:600;font-size:12.5px;color:var(--mute);margin-top:2px}
.big{font:900 44px/1.05 Inter;letter-spacing:-.03em}
.grid{font-size:21px;letter-spacing:1px;margin:8px 0 12px;white-space:nowrap}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev:first-child{border-top:0;padding-top:0}
.rev .h{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);font-weight:600}
.rev .qq{font-weight:650;margin:4px 0}
.rev .a{font-size:14px}.rev .a.ok{color:var(--green)}.rev .a.no{color:var(--red)}
.rev .e{font-size:13.5px;color:#c6ccd6;margin-top:4px}
.pct{height:5px;background:var(--panel2);border-radius:3px;margin-top:6px;overflow:hidden}.pct i{display:block;height:100%;background:var(--blue)}
.missed{background:#1c2236;border:1px solid #2d3a5e;border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:13px;z-index:70;max-width:90%}
textarea.share{width:100%;height:110px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:13px "JetBrains Mono",monospace;margin-top:8px}
.adm .d{border-top:1px solid var(--line);padding:10px 0}
.adm .it{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:4px 0}
.adm .it .t{flex:1}.adm .it .t b{color:var(--green);font-weight:600}
.adm .sw{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;flex:none}
details summary{cursor:pointer;color:var(--mute);font-size:13px;font-weight:700}
.rules li{margin:5px 0;color:#c6ccd6;font-size:13.5px}
.flag{background:none;border:0;color:var(--dim);font-size:12px;text-decoration:underline;padding:4px 0}
.fire{color:var(--dawn)}
.gear{background:none;border:0;font-size:20px;cursor:pointer;padding:4px 6px;margin-left:auto}
.gear + .me{margin-left:6px}
.ownerbar{margin:4px 0 14px}
.testtag{font-size:12.5px;font-weight:600;color:#8a4b14;background:#fff1dd;border:1px solid #f2d3a6;border-radius:8px;padding:6px 10px;margin-bottom:8px;text-align:center}
.tog{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-weight:600;cursor:pointer}
.tog input{width:20px;height:20px}
.mixes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.mix{background:var(--card2,#1d232c);border:1px solid var(--line,#2a313b);color:inherit;border-radius:10px;padding:10px 6px;cursor:pointer;text-align:center;font:inherit}
.mix b{display:block;font-size:14px}.mix span{display:block;font-size:11px;opacity:.75;margin-top:3px;line-height:1.3}
.mix.on{border-color:var(--amber,#ffb347);box-shadow:0 0 0 1px var(--amber,#ffb347) inset}
.lvl.l0{background:#5a1f2b;color:#ffc2cc}

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ---- Crude Awakening: "marked to market" theme ----
   Daylight, not a dungeon. One loud thing: the orange masthead with the mark, the gap between
   what you think you're worth (10) and what the tape says. Everything else is quiet paper and ink. */
:root{--bg:#f3f5f8;--panel:#ffffff;--panel2:#edf0f5;--line:#d5dbe5;--text:#0f1b3d;--mute:#56617a;--dim:#6f7a92;
--sun:#f26b21;--sun2:#ffd9c2;--dawn:#c9480d;--green:#0b7f58;--red:#c8322f;--blue:#2456c8;--card2:#edf0f5;--amber:#f26b21;
--ink:#0f1b3d;--disp:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif}
html{background:var(--bg);overflow-x:clip}
html,body{font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* masthead */
.mast{position:relative;z-index:0;margin:-16px 0 16px;padding:10px 0 22px;color:var(--ink)}
.mast::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);background:#f26b21}
.mast .bar{display:flex;justify-content:flex-end;align-items:flex-start;min-height:30px}
.mast .gear{margin-left:0;font-size:18px}
.mast .me{background:none;border:0;color:var(--ink);font-size:13px;font-weight:600;text-align:right;padding:4px 0 4px 8px;line-height:1.3}
.mast .fire{color:var(--ink)}
.mast h1{font-family:var(--disp);font-weight:800;font-stretch:82%;font-size:clamp(52px,16vw,92px);line-height:.88;letter-spacing:-.005em;margin:0 0 0 -3px;color:var(--ink)}
.mast h1 span{display:block}
.mast .tag{margin:12px 0 0;max-width:36ch;font-size:15px;line-height:1.45;font-weight:500;color:var(--ink)}
.mtm{margin-top:18px;--p:100%}
.mtm .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13.5px;font-weight:600}
.mtm .row>*{flex:none}
.mtm .row b{font-family:var(--disp);font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}

.mtm .mk{margin-top:8px;align-items:flex-end}
.mtm .mk b{font-size:54px;line-height:.82;font-weight:800;letter-spacing:-.02em}
.mtm .mk small{display:block;font-size:12.5px;font-weight:500;margin-top:1px}
.mtm .mk em{font-style:normal;font-weight:600}
.mtm .scale{position:relative;height:18px;margin:7px 9px 0}
.mtm .scale::before{content:"";position:absolute;left:-9px;right:-9px;top:8px;height:2px;background:var(--ink)}
.mtm .scale::after{content:"";position:absolute;left:var(--p);right:0;top:8px;height:2px;background:repeating-linear-gradient(90deg,#f26b21 0 4px,transparent 4px 8px)}
.mtm .scale i{position:absolute;top:0;width:18px;height:18px;margin-left:-9px;border-radius:50%;box-sizing:border-box}
.mtm .ring{left:100%;border:2px solid var(--ink);background:#f26b21;z-index:1}
.mtm .dot{left:var(--p);background:#fff;border:2px solid var(--ink);z-index:2}
.mast .dnote{margin:18px 0 0;padding:11px 14px;background:#fff;color:var(--ink);font-weight:500;font-size:14.5px;line-height:1.45;border-radius:4px 14px 14px 14px;white-space:pre-line}
.mast.compact{margin:0 0 12px;padding:0}
.mast.compact::before{display:none}
.mast.compact h1{font-size:20px;line-height:1.1;letter-spacing:-.02em;margin:0;padding-left:12px;border-left:6px solid #f26b21}
.mast.compact h1 span{display:inline}

/* surfaces */
.card{border-radius:14px}
.hero{background:var(--ink);border-color:var(--ink);color:#fff;--text:#fff;--mute:#b9c2d6;--dim:#93a0bb;--line:#2b3961;--panel2:#1b2950;--dawn:#ff9a5c;border-radius:4px 22px 22px 22px}
.hero .day{font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--sun2)}
.hero h2{font-family:var(--disp);font-weight:800;font-stretch:87%;font-size:30px;letter-spacing:-.025em;margin:6px 0 6px}
.hero .note{color:#c9d1e3!important}
.kpis{gap:0;margin-top:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{background:none;border-radius:0;padding:12px 4px;text-align:left}
.kpi:first-child{padding-left:0}
.kpi + .kpi{border-left:1px solid var(--line);padding-left:12px}
.kpi b{font:700 24px/1.1 var(--disp);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;font-weight:500}
.taunt{margin:18px 0 12px;font-family:var(--disp);font-weight:600;font-size:19px;line-height:1.25;letter-spacing:-.01em;color:#fff}
.verdict{margin:10px auto 6px;max-width:32ch;font-family:var(--disp);font-weight:600;font-size:18px;line-height:1.3;color:#fff}
.count{font:700 13px var(--disp);font-variant-numeric:tabular-nums}
.big{font-family:var(--disp);font-variant-numeric:tabular-nums}

/* controls */
.btn{background:#f26b21;color:var(--ink);border-radius:10px;font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.005em}
.btn:hover{background:#ff7d36}
.btn.sec{background:var(--panel);color:var(--text);border:1.5px solid var(--text);font-size:15px}
.btn.sec:hover{background:var(--panel2)}
.hero .btn.sec{background:none;border-color:#5b6890}
.btn.ghost,.btn.ghost:hover{background:none;color:var(--mute);font-family:inherit;font-size:14px;font-weight:600}
label.f{text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:600;color:var(--text)}
input.in,textarea.in,select.in{width:100%;display:block;background:var(--panel);border:1.5px solid #aab3c5;border-radius:10px;padding:12px;color:var(--text);font:inherit;font-size:16px;line-height:1.4}
input.in:focus,textarea.in:focus,select.in:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
.chip{background:var(--panel);border-color:#aab3c5;color:var(--text)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs{background:none;border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding:0;gap:0}
.tabs button{border-radius:0;padding:10px 2px;font-size:13.5px;font-weight:600;margin-bottom:-1.5px;border-bottom:3px solid transparent}
.tabs button.on{background:none;color:var(--text);border-bottom-color:#f26b21}

/* leaderboard */
.lb .rk,.lb .sc{font-family:var(--disp);font-variant-numeric:tabular-nums}
.lb .sc{font-size:15px}
.lb .sub{color:var(--mute)}
.lb tr.mine td{background:#fde6d8}
.lb tr.mine td:first-child{box-shadow:inset 4px 0 0 #f26b21}

/* play */
.q{font-family:var(--disp);font-weight:700;font-size:21px;line-height:1.28;letter-spacing:-.015em}
.clock b{font:700 16px var(--disp);font-variant-numeric:tabular-nums}
.clock .bar i{background:#f26b21}
.dots i.cur{background:var(--ink)}
.opt{background:var(--panel);border:1.5px solid #aab3c5;border-radius:10px;color:var(--text)}
.opt .l{font:700 14px/1 var(--disp);background:var(--panel2);color:var(--text)}
.opt.pick{border-color:var(--ink);background:#fde6d8}.opt.pick .l{background:var(--ink);color:#fff}
.opt.right{border-color:var(--green);background:#e2f3ec}.opt.right .l{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#fbe6e4}.opt.wrong .l{background:var(--red);color:#fff}
.fb.ok{background:#e2f3ec}.fb.no{background:#fbe6e4}
.lvl{text-transform:none;letter-spacing:0;font-weight:700}
.lvl.l0{background:#f6e0ea;color:#8c1f4d}.lvl.l1{background:#e2f3ec;color:var(--green)}.lvl.l2{background:#fde6d8;color:#9a3d08}.lvl.l3{background:#fbe6e4;color:var(--red)}
.rev .e,.rules li{color:var(--mute)}
.missed{background:#e8eefb;border-color:#c3d0f0}
.mix{background:var(--panel2);border-color:var(--line)}
.toast{background:var(--ink);border-color:var(--ink);color:#fff}
textarea.share{font-family:inherit}
.note[style*="ff8a8a"]{color:var(--red)!important}
#gh-notice{background:var(--panel)!important;border:1.5px solid var(--ink)!important;border-radius:10px!important;margin:10px 16px 26px!important}
@media (min-width:592px){#gh-notice{margin:10px auto 26px!important}}
#orgfoot{opacity:1!important;color:var(--mute)}
[data-adm-tab]{margin-top:0!important}
.mtm .you{top:3px;width:12px;height:12px;margin-left:-6px;background:var(--ink);border:2px solid #fff;z-index:3}
/* smaller masthead */
.mast{padding:6px 0 14px}
.mast .bar{min-height:24px}
.mast h1{font-size:clamp(34px,10vw,52px);line-height:.92}
.mast h1 span{display:inline}
.mast .tag{margin-top:6px;font-size:14px;line-height:1.4}
.mtm{margin-top:12px}
.mtm .mk{margin-top:0;align-items:flex-end}
.mtm .mk b{font-size:34px}
.mtm .mk small{font-size:12px}
.mtm .scale{margin:8px 9px 0;height:14px}
.mtm .scale::before{top:6px}
.mtm .scale::after{display:none}
.mtm .scale .dot{width:14px;height:14px;margin-left:-7px;top:0}
.mtm .you{top:2px;width:10px;height:10px;margin-left:-5px}
.mast .dnote{margin-top:12px;padding:8px 12px;font-size:14px}
</style>
</head>

    const k = TODAY(), rows = [["name", "team", "joined", "days_played", "total_score", "streak", "last_played", "today_score"]];
    ADM.players.forEach(p => { const ds = daysOf(p).filter(d => p.days[d].done); rows.push([p.name, p.dept || "", p.joined ? new Date(p.joined).toISOString().slice(0, 10) : "", ds.length, ds.reduce((s, d) => s + scoreOf(p, d), 0), strk(p), ds[ds.length - 1] || "", played(p, k) ? scoreOf(p, k) : ""]); });
    const text = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type: "text/csv"})); a.download = "crude-awakening-players-" + k + ".csv"; document.body.appendChild(a); a.click(); a.remove();
  }
  async function admAct(t){
    const ds = t.dataset, k = TODAY();
    try {
      if (ds.admTab) { ADM.tab = ds.admTab; ADM.edit = null; ADM.arm = null; return admRender(); }
      if (ds.admSort) { ADM.sort = ds.admSort; return admRender(); }
      if (ds.admCsv) return csv();
      if (ds.admEdit) { ADM.edit = ds.admEdit; ADM.arm = null; return admRender(); }
      if (ds.admCancel) { ADM.edit = null; return admRender(); }
      if (ds.admSave) {
        const name = (document.getElementById("adm-name").value || "").trim().slice(0, 24), dept = document.getElementById("adm-dept").value;
        if (!name) return;
        if (ADM.players.some(p => p.id !== ds.admSave && nkey(p.name) === nkey(name))) { t.insertAdjacentHTML("afterend", '<p class="note">Another player already uses that name. Merge them instead.</p>'); return; }
        await retry("admin edit", () => fs.doc("players/" + ds.admSave).set({name, dept}, {merge: true}));
        ADM.edit = null; await admLoad(); return admRender();
      }
      if (ds.admReset) {
        if (ADM.arm !== "reset:" + ds.admReset) { ADM.arm = "reset:" + ds.admReset; return admRender(); }
        await retry("admin reset", () => fs.doc("players/" + ds.admReset).set({days: {[k]: null}}, {merge: true}));
        ADM.arm = null; await admLoad(); return admRender();
      }
      if (ds.admDel) {
        if (ADM.arm !== "del:" + ds.admDel) { ADM.arm = "del:" + ds.admDel; return admRender(); }
        await retry("admin remove", () => fs.doc("players/" + ds.admDel).delete());
        ADM.arm = null; await admLoad(); return admRender();
      }
      if (ds.admUnflag) { for (const f of ADM.flags.filter(f => f.qid === ds.admUnflag)) await fs.doc("flags/" + f.id).delete(); await admLoad(); return admRender(); }
      if (ds.admClearerrs) {
        if (ADM.arm !== "errs") { ADM.arm = "errs"; return admRender(); }
        for (const e of ADM.errs) await fs.doc("errs/" + e.id).delete().catch(() => {});
        ADM.arm = null; await admLoad(); return admRender();
      }
      if (ds.admDnote || ds.admDnoteClear) {
        const x = ds.admDnote || ds.admDnoteClear, text = ds.admDnote ? (document.getElementById("adm-dn-" + x).value || "").trim().slice(0, 280) : "";
        await retry("admin daily note", () => fs.doc("config/note-" + x).set({text, at: Date.now()}));
        return admRender();
      }
      if (ds.admNotice) {
        const text = ds.admNotice === "save" ? (document.getElementById("adm-notice").value || "").trim().slice(0, 200) : "";
        await retry("admin notice", () => fs.doc("config/notice").set({text, at: Date.now()}));
        return admRender();
      }
    } catch (e) { logErr("admin action", e); const b = document.getElementById("adm-body"); if (b) b.insertAdjacentHTML("afterbegin", '<p class="note" style="color:#ff8a8a">That didn\'t work (' + esc(e && e.code || "error") + '). Try again.</p>'); }
  }
  document.addEventListener("click", e => { const t = e.target && e.target.closest && e.target.closest("[data-adm-tab],[data-adm-sort],[data-adm-csv],[data-adm-edit],[data-adm-cancel],[data-adm-save],[data-adm-reset],[data-adm-del],[data-adm-unflag],[data-adm-clearerrs],[data-adm-notice],[data-adm-dnote],[data-adm-dnote-clear]"); if (t) admAct(t); });

  // Daily note under the title: config/note-YYYY-MM-DD (London date), switches over at midnight
  let NOTEDAY = null, NOTEOFF = null;
  function watchDailyNote(){
    const k = TODAY(); if (k === NOTEDAY) return; NOTEDAY = k;
    if (NOTEOFF) { try { NOTEOFF(); } catch (e) {} }
    window.GH_NOTE = ""; window.dispatchEvent(new Event("gh-rerender"));
    try {
      NOTEOFF = fs.doc("config/note-" + k).onSnapshot(d => {
        const t = d.exists ? String((d.data() || {}).text || "").trim() : "";
        if (t !== window.GH_NOTE) { window.GH_NOTE = t; window.dispatchEvent(new Event("gh-rerender")); }
      }, () => {});
    } catch (e) {}
  }
  setInterval(() => { if (NOTEDAY) watchDailyNote(); }, 60000);

  // Notice banner for everyone
  function watchNotice(){
    watchDailyNote();
    try {
      fs.doc("config/notice").onSnapshot(d => {
        const n = d.exists ? d.data() : null; let el = document.getElementById("gh-notice");
        if (!n || !n.text) { if (el) el.remove(); return; }
        if (!el) { el = document.createElement("div"); el.id = "gh-notice"; el.style.cssText = "max-width:520px;margin:10px auto 0;padding:10px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--sun);font-size:14px"; const app = document.getElementById("app"); app.parentNode.insertBefore(el, app); }
        el.textContent = "📣 " + n.text;
      }, () => {});
    } catch (e) {}
  }

  // ---- Organiser: merge duplicate players into one record ----
  let MRG = [];
  const dayCount = x => Object.keys(x.days || {}).filter(k => x.days[k]).length;
  const lastDay = x => Object.keys(x.days || {}).filter(k => x.days[k]).sort().pop() || "-";
  async function openMerge(){
    dialog('<b>Merge duplicate players</b><p class="note">Loading players…</p>');
    try {
      const s = await fs.collection("players").get();
      MRG = s.docs.map(d => Object.assign({id: d.id}, d.data())).filter(x => x.name)
        .sort((a, b) => a.name.toLowerCase() < b.name.toLowerCase() ? -1 : a.name.toLowerCase() > b.name.toLowerCase() ? 1 : (a.joined || 0) - (b.joined || 0));
      let h = '<b>Merge duplicate players</b><p class="note" style="margin:8px 0 10px">Tick every entry that is the same person (2 or more), then merge. All their days are combined into the one you keep (if two entries played the same day, the first attempt counts), the others are removed, and their browsers become that player.</p>';
      h += '<div style="max-height:45vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 8px">' + MRG.map((x, i) =>
        '<label style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><input type="checkbox" class="mrgck" data-i="' + i + '" style="width:20px;height:20px"><span><b>' + esc(x.name) + '</b> · ' + esc(x.dept || "") + '<br><span class="note">' + dayCount(x) + ' day(s) · last ' + lastDay(x) + ' · joined ' + (x.joined ? new Date(x.joined).toISOString().slice(0, 10) : "?") + '</span></span></label>').join("") + '</div>';
      h += '<p class="note" style="margin:12px 0 6px">Keep which name and team?</p><select class="in" id="mrgkeep"><option value="">Tick entries first</option></select>';
      h += '<button class="btn" id="mrggo" style="margin-top:10px">Merge</button><p class="note" id="mrgmsg" style="margin-top:8px"></p>';
      dialog(h);
    } catch (e) { logErr("merge list", e); dialog('<b>Merge duplicate players</b><p class="note">Couldn\'t load players. Check your connection.</p>'); }
  }
  function mrgPicked(){ return Array.from(document.querySelectorAll(".mrgck")).filter(c => c.checked).map(c => MRG[+c.dataset.i]); }
  function mrgRefresh(){
    const sel = document.getElementById("mrgkeep"); if (!sel) return;
    const p = mrgPicked();
    sel.innerHTML = p.length ? p.map(x => '<option value="' + esc(x.id) + '">' + esc(x.name) + ' · ' + esc(x.dept || "") + ' (' + dayCount(x) + ' day(s), last ' + lastDay(x) + ')</option>').join("") : '<option value="">Tick entries first</option>';
  }
  async function doMerge(){
    const msg = document.getElementById("mrgmsg"), btn = document.getElementById("mrggo");
    const p = mrgPicked(), keepId = document.getElementById("mrgkeep").value;
    if (p.length < 2 || !keepId) { msg.textContent = "Tick at least two entries."; return; }
    const keep = p.find(x => x.id === keepId), others = p.filter(x => x.id !== keepId);
    btn.disabled = true; msg.textContent = "Merging…";
    try {
      const K = (await fs.doc("players/" + keepId).get()).data() || {};
      const days = Object.assign({}, K.days || {}), uids = new Set(K.uids || []);
      for (const o of others) {
        const O = (await fs.doc("players/" + o.id).get()).data() || {};
        Object.keys(O.days || {}).forEach(k => {
          const a = days[k], b = O.days[k]; if (!b) return;
          // same day played twice: keep the first attempt (earliest start), so a replay never counts
          if (!a || (b.st && (!a.st || b.st < a.st))) days[k] = b;
        });
        uids.add(o.id); (O.uids || []).forEach(x => uids.add(x));
      }
      uids.delete(keepId);
      await retry("merge keep", () => fs.doc("players/" + keepId).update({days, uids: Array.from(uids).slice(0, 10)}));
      for (const o of others) await retry("merge remove", () => fs.doc("players/" + o.id).delete());
      msg.textContent = "Merged " + p.length + " entries into " + keep.name + ". Reloading…";
      setTimeout(() => location.reload(), 900);
    } catch (e) { btn.disabled = false; logErr("merge", e); msg.textContent = "Merge failed (" + (e && e.code || "error") + "). Nothing was removed unless the first step finished; try again."; }
  }
  document.addEventListener("change", e => { if (e.target && e.target.classList && e.target.classList.contains("mrgck")) mrgRefresh(); });

  // ---- Link devices: one player record across browsers (anonymous sign-in is per browser) ----
  const ABC = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const newCode = () => { const a = new Uint32Array(8); crypto.getRandomValues(a); return Array.from(a, x => ABC[x % ABC.length]).join(""); };
  const esc = t => String(t).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  function dialog(html){
    let o = document.getElementById("lnk"); if (o) o.remove();
    o = document.createElement("div"); o.id = "lnk";
    o.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px";
    o.innerHTML = '<div class="card" style="max-width:420px;width:100%;margin:0">' + html + '<button class="btn sec" id="lnkclose" style="margin-top:12px">Close</button></div>';
    document.body.appendChild(o); return o;
  }
  async function openLink(){
    const mine = await fs.doc("players/" + PID).get().catch(() => null);
    const has = mine && mine.exists && mine.data().name;
    let h = '<b>Play on another phone or computer</b><p class="note" style="margin:8px 0 12px">Each browser starts as a new player. Link them so your scores, streak and name stay in one place.</p>';
    if (has) h += '<p class="note" style="margin:0 0 8px"><b>On this device</b> (' + esc(mine.data().name) + '): get a code, then enter it on the other device within 15 minutes.</p><button class="btn" id="lnkget">Get a code</button><div id="lnkcode" style="font-size:28px;font-weight:800;letter-spacing:4px;text-align:center;margin:12px 0 4px"></div>';
    h += '<p class="note" style="margin:14px 0 8px"><b>Got a code from your other device?</b> Enter it here' + (has ? '. Today\'s and past scores from this device are moved across (where that device has no score for the day), and this device\'s separate entry is removed.' : '.') + '</p><input class="in" id="lnkin" maxlength="9" autocapitalize="characters" autocomplete="off" placeholder="8-letter code" style="text-transform:uppercase;letter-spacing:3px"><button class="btn sec" id="lnkuse" style="margin-top:10px">Link this device</button><p class="note" id="lnkmsg" style="margin-top:8px"></p>';
    dialog(h);
  }
  async function getCode(){
    const box = document.getElementById("lnkcode"); box.textContent = "…";
    try {
      const code = newCode();
      await retry("link create", () => fs.doc("links/" + code).set({pid: PID, exp: Date.now() + 15 * 60 * 1000}));
      box.textContent = code.slice(0, 4) + " " + code.slice(4);
    } catch (e) { box.textContent = ""; document.getElementById("lnkcode").insertAdjacentHTML("afterend", '<p class="note">Couldn\'t make a code. Check your connection and try again.</p>'); }
  }
  async function useCode(){
    const msg = document.getElementById("lnkmsg"), btn = document.getElementById("lnkuse");
    const code = (document.getElementById("lnkin").value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (code.length !== 8) { msg.textContent = "The code has 8 letters and numbers."; return; }
    btn.disabled = true; msg.textContent = "Linking…";
    try {
      const L = await fs.doc("links/" + code).get();
      if (!L.exists || !L.data().pid || L.data().exp < Date.now()) throw {code: "bad-code"};
      const target = L.data().pid;
      if (target === PID) { msg.textContent = "This device is already that player."; btn.disabled = false; return; }
      const T = await fs.doc("players/" + target).get();
      if (!T.exists) throw {code: "bad-code"};
      const t = T.data(), uids = Array.isArray(t.uids) ? t.uids : [];
      if (!uids.includes(AUTHUID)) await retry("link join", () => fs.doc("players/" + target).update({uids: uids.concat([AUTHUID]), lastLink: code}));
      // move this device's own scores across (days the other record doesn't have), then remove the duplicate
      const M = await fs.doc("players/" + PID).get();
      if (M.exists && PID === AUTHUID) {
        const md = M.data().days || {}, td = t.days || {}, add = {};
        Object.keys(md).forEach(k => { if (md[k] && !td[k]) add[k] = md[k]; });
        if (Object.keys(add).length) await retry("link merge", () => fs.doc("players/" + target).set({days: add}, {merge: true}));
        await retry("link remove", () => fs.doc("players/" + PID).delete());
      }
      await retry("link device", () => fs.doc("devices/" + AUTHUID).set({pid: target}));
      msg.textContent = "Linked! Reloading…"; setTimeout(() => location.reload(), 700);
    } catch (e) {
      btn.disabled = false;
      msg.textContent = e && e.code === "bad-code" ? "That code isn't valid or has expired. Get a new one on your other device." : "Couldn't link. Check your connection and try again.";
      if (!(e && e.code === "bad-code")) logErr("link", e);
    }
  }
  document.addEventListener("click", async e => {
    const t = e.target && e.target.closest ? (e.target.closest("[id]") || e.target) : e.target;
    if (t && t.id === "orgin") {
      e.preventDefault();
      try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); location.reload(); }
      catch (x) { if (x && x.code !== "auth/popup-closed-by-user") console.warn("organiser sign-in failed", x && x.code); }
    }
    if (t && t.id === "orgout") { e.preventDefault(); await auth.signOut(); location.reload(); }
    if (t && t.id === "lnkopen") { e.preventDefault(); openLink(); }
    if (t && t.id === "lnkclose") { const o = document.getElementById("lnk"); if (o) o.remove(); }
    if (t && t.id === "lnkget") { getCode(); }
    if (t && t.id === "lnkuse") { useCode(); }
    if (t && t.id === "mrgopen") { e.preventDefault(); openMerge(); }
    if (t && t.id === "admopen") { e.preventDefault(); openAdmin(); }
    if (t && t.id === "mrggo") { doMerge(); }
  });
})();

["ref15","REF",1,2,"A refinery is long its margin. How does it hedge forward?",["Sell the crack: buy crude, sell products","Buy the crack: sell crude, buy products","Buy both crude and products","Sell both crude and products"],"Refiners naturally own the crack, so they sell it forward to lock in margin."],
["ref16","REF",2,3,"Why does a vacuum distillation unit run under vacuum?",["To lower boiling points and avoid thermal cracking of heavy cuts","To raise gasoline octane","To strip out hydrogen sulphide","To increase coke yield"],"Atmospheric residue would crack above about 370 °C. Vacuum lets heavy gasoil be separated at lower temperature."],

["bld01","BLD",3,2,"What exponent does the Chevron RVP blending index apply to RVP?",["1.25","1.00","1.50","2.00"],"Each component's RVP^1.25 is volume-averaged, then the result is taken to the power 1/1.25."],
["bld02","BLD",3,2,"Which of these blendstocks has the lowest octane sensitivity (RON − MON)?",["Alkylate","Reformate","FCC naphtha","Ethanol"],"Alkylate's sensitivity is only about 2–3 points; reformate and FCC naphtha run around 10–12."],
["bld03","BLD",3,2,"Roughly how much oxygen by mass does E10 gasoline contain?",["About 3.5 wt%","About 1 wt%","About 7 wt%","About 10 wt%"],"Ethanol is about 35% oxygen by mass, so 10 vol% ethanol gives roughly 3.5 wt% oxygen."],
["bld04","BLD",3,3,"What is the oxygen content of neat MTBE by mass?",["About 18 wt%","About 9 wt%","About 27 wt%","About 35 wt%"],"MTBE (C₅H₁₂O) is about 18.2% oxygen. Ethanol is about 35%."],
["bld05","BLD",2,1,"Blending 10% ethanol into gasoline raises its RVP by roughly how much?",["About 1 psi","Nothing; ethanol lowers RVP","About 3 psi","About 5 psi"],"The non-ideal azeotropic effect adds about 1 psi, which is why US rules grant E10 a 1 psi waiver."],

["bld08","BLD",3,3,"What is the maximum olefins content of EN 228 gasoline?",["18% vol","10% vol","25% vol","35% vol"],"18% vol olefins is the cap; FCC naphtha is the main source of olefins."],
["bld09","BLD",3,2,"Under EN 228, what is the maximum summer vapour pressure for Class A gasoline?",["60 kPa","45 kPa","70 kPa","90 kPa"],"Class A is 45–60 kPa. Winter classes go higher."],
["bld10","BLD",1,1,"What is the maximum sulphur content of EN 228 gasoline?",["10 ppm","15 ppm","50 ppm","30 ppm"],"Europe has been at 10 ppm since 2009."],
["bld11","BLD",2,2,"What is the US Tier 3 annual average sulphur standard for gasoline?",["10 ppm","15 ppm","30 ppm","80 ppm"],"Tier 3 cut the average from 30 ppm to 10 ppm from 2017, with an 80 ppm per-gallon cap."],
["bld12","BLD",3,2,"Which distillation points make up the ASTM D4814 Driveability Index?",["T10, T50 and T90","IBP, T50 and FBP","T5 and T95","E70, E100 and E150"],"DI = 1.5·T10 + 3·T50 + T90, plus an ethanol correction. E70/E100/E150 is the European way of describing volatility."],

["bld14","BLD",2,1,"Normal butane blending swings seasonally mainly because of what?",["Summer RVP limits tighten","Butane's octane drops in winter","Butane is only available in summer","Ethanol mandates fall away in summer"],"Butane is cheap, high-RVP octane. Winter RVP allowances let blenders pack more of it in."],

function boards(players, today) {
  const week = Array.from({length: 7}, (_, i) => addDays(today, -i));
  const rows = players.map(p => {
    const d = p.days || {};
    const t = d[today] && d[today].done ? tally(d[today].a) : null;
    let wk = 0, wkPlayed = 0; week.forEach(k => { if (d[k] && d[k].done) { wk += tally(d[k].a).sc; wkPlayed++; } });
    let tot = 0, played = 0, best = 0; Object.keys(d).forEach(k => { if (d[k] && d[k].done) { const s = tally(d[k].a).sc; tot += s; played++; best = Math.max(best, s); } });
    return {id: p.id, name: p.name || "Player", dept: p.dept || "Other", today: t, inProgress: !!(d[today] && !d[today].done), week: wk, weekPlayed: wkPlayed, avg: played ? Math.round(tot / played) : 0, played, best, streak: streak(d, today)};
  });
  const today_ = rows.filter(r => r.today).sort((a, b) => b.today.sc - a.today.sc || a.today.ms - b.today.ms);
  const week_ = rows.filter(r => r.weekPlayed).sort((a, b) => b.week - a.week);
  const all_ = rows.filter(r => r.played).sort((a, b) => ((b.played >= 3) - (a.played >= 3)) || b.avg - a.avg);
  const depts = {};
  rows.forEach(r => {
    const x = depts[r.dept] = depts[r.dept] || {dept: r.dept, players: 0, todaySum: 0, todayN: 0, weekSum: 0};
    x.players++; if (r.today) { x.todaySum += r.today.sc; x.todayN++; } x.weekSum += r.week;
  });
  const teams = Object.values(depts).map(x => ({dept: x.dept, players: x.players, todayAvg: x.todayN ? Math.round(x.todaySum / x.todayN) : 0, todayN: x.todayN, weekAvg: Math.round(x.weekSum / x.players)})).sort((a, b) => b.todayAvg - a.todayAvg || b.weekAvg - a.weekAvg);
  return {rows, today: today_, week: week_, all: all_, teams, inProgress: rows.filter(r => r.inProgress).length};
}

<script>
(function(){
"use strict";
const DB = buildDailyBank(BANK);
let QBY = {}, POOLS = null;
const BATCHES = {[BATCH1.id]: BATCH1, [BATCH2.id]: BATCH2};
function rebuildPool(){
  const ok = it => Array.isArray(it) && typeof it[0] === "string" && typeof it[5] === "string" && Array.isArray(it[6]) && it[6].length === 4 && [0,1,2,3].includes(it[4]);
  const list = Object.values(BATCHES).map(b => ({id: b.id, added: b.added, items: (b.items || []).filter(ok).map(batchToDaily)}));
  const q = {}; DB.forEach(x => q[x[0]] = x); list.forEach(b => b.items.forEach(x => { if (x[1] >= 0 && !q[x[0]]) q[x[0]] = x; }));
  QBY = q; POOLS = pools(DB, list);
}
rebuildPool();
const LET = ["A","B","C","D"];
const DEPTS = ["Trading","Research","Operations","Engineering","Biz Dev","Finance","Other"];
const LVL = {0: "Expert", 1: "Easy", 2: "Medium", 3: "Hard"};
const $app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const S = {
  db: null, user: null, uid: null, owner: false, ready: false, failed: false,
  players: {}, sched: {}, flags: [], loaded: false, cfg: {},
  view: "home", tab: "today", key: todayKey(),
  play: null, // {key, set, i, t0, picked, fb, timer}
  edit: null, shareOpen: false, flagged: {}
};

(async function init(){
  try {
    if (window.FBDB) {
      const g = await window.FBDB.start();
      S.db = g.db; S.uid = g.uid; S.owner = g.owner;
    }
  } catch(e){}
  S.ready = true;
  if (S.db && S.uid) { S.failed = false; subscribe(); } else S.failed = true;
  render();
})();
setTimeout(() => { if (!S.ready) { S.ready = true; S.failed = true; render(); } }, 25000);

function subscribe(){

  S.db.collection("players").onSnapshot(snap => {
    got = true; clearTimeout(t);
    const m = {}; snap.docs.forEach(d => { const x = d.data(); if (x) m[d.id] = Object.assign({id: d.id}, x); });
    const first = !S.loaded; S.players = m; S.loaded = true; const joining = !me() || !me().name || S.view === "profile"; if (first || !joining) render();
  }, e => toast("Lost connection (" + e.code + ")."));

    let changed = false;
    snap.docs.forEach(d => { const x = d.data(); if (x && Array.isArray(x.items) && x.added && !BATCHES[d.id]) { BATCHES[d.id] = {id: d.id, added: x.added, items: x.items}; changed = true; } });
    if (changed) { rebuildPool(); if (!S.play) render(); }
  }, e => {});

    const m = {}; snap.docs.forEach(d => { const x = d.data(); if (x) m[d.id] = x; }); S.sched = m; setOverrides(m); S.schedReady = true;
    if (!S.play) render();
  }, e => {});
  S.db.doc("config/settings").onSnapshot(d => { S.cfg = (d && d.data && d.data()) || {}; setMix(S.cfg.mix); setMixHistory(S.cfg.mixHist, S.cfg.mix); S.cfgReady = true; if (!S.play) render(); }, e => { S.cfgReady = true; });
  if (S.owner) S.db.collection("flags").onSnapshot(snap => { S.flags = snap.docs.map(d => Object.assign({id: d.id}, d.data())); if (S.view === "admin") render(); }, e => {});
}
const meDoc = () => S.uid ? S.db.doc("players/" + S.uid) : null;
const me = () => S.players[S.uid] || null;
async function saveMe(patch){
  try {
    if (me()) await meDoc().update(patch);
    else await meDoc().set(Object.assign({joined: Date.now(), days: {}}, patch));
  } catch(e){ toast(e && (e.code === "permission-denied" || e.code === "invalid_argument") ? "That couldn't be saved (not allowed). Reload and try again." : "Couldn't save — check your connection."); throw e; }
}
function todaySet(k){ return daySet(DB, k, S.sched[k], POOLS); }
// the set a player actually got (saved at start, so a mid-day swap can't mix up their review)
function setFor(day, k){ return day && Array.isArray(day.ids) && day.ids.length === 10 && day.ids.every(id => QBY[id]) ? daySet(DB, k, {ids: day.ids}, POOLS) : todaySet(k); }
const sameSet = (x, y, k) => setFor(x, k).map(s => s.id).join() === setFor(y, k).map(s => s.id).join();
const testing = () => S.owner && !!S.cfg.testing;
async function freshTestSet(){
  const k = S.key, cur = new Set(todaySet(k).map(s => s.id));
  const used = new Set(Array.isArray(S.cfg.testUsed) ? S.cfg.testUsed : []);
  const near = new Set(); for (let d = LAUNCH; d <= addDays(k, 45); d = addDays(d, 1)) todaySet(d).forEach(s => near.add(s.id));
  const mine = new Set(); Object.values((me() && me().days) || {}).forEach(d => { if (d && Array.isArray(d.ids)) d.ids.forEach(x => mine.add(x)); });
  const eff = lv => (lv === 0 && !POOLS[0].length) ? 3 : lv, PAT = PATTERN.map(eff);
  const need = {}; PAT.forEach(lv => need[lv] = (need[lv] || 0) + 1);
  const pick = {0: [], 1: [], 2: [], 3: []};
  [0, 1, 2, 3].forEach(lv => {
    const n = need[lv] || 0; if (!n) return;
    let c = POOLS[lv].filter(id => !near.has(id) && !used.has(id) && !mine.has(id));
    if (c.length < n) c = POOLS[lv].filter(id => !cur.has(id) && !used.has(id) && !mine.has(id));
    if (c.length < n) c = POOLS[lv].filter(id => !cur.has(id));
    for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; }
    pick[lv] = c;
  });
  const ids = PAT.map(lv => pick[lv].shift());
  if (ids.some(x => !x)) { toast("Not enough unused questions left."); return false; }
  try {
    await S.db.doc("schedule/" + k).set({ids, by: S.uid, at: Date.now(), test: true});
    await S.db.doc("config/settings").set(Object.assign({}, S.cfg, {testUsed: [...used, ...ids].slice(-2000)}));
    if (me() && me().days && me().days[k]) await meDoc().update({days: {[k]: null}});
  } catch(e){ toast("Couldn't refresh: only the organiser can do this."); return false; }
  S.sched[k] = {ids}; setOverrides(S.sched); S.view = "home"; toast("New set loaded. Your play for today is reset.");
  return true;
}

// day rollover check
setInterval(() => {
  const k = todayKey();
  if (k !== S.key && !S.play) { S.key = k; render(); }
  const el = document.getElementById("cd"); if (el) el.textContent = countdown();
}, 1000);
function countdown(){ const s = secsToMidnight(); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h + "h " + String(m).padStart(2, "0") + "m " + String(x).padStart(2, "0") + "s"; }

// ---------- play flow ----------
async function startPlay(){
  const k = S.key, mine = me();
  const day = mine && mine.days && mine.days[k];
  if (day && day.done) return;
  if (!day && (!S.schedReady || !S.cfgReady)) { toast("Still loading today's set — try again in a second."); return; }
  const set = day ? setFor(day, k) : todaySet(k);
  let a = (day && day.a) ? day.a.slice() : [];
  if (!day) { await saveMe({days: {[k]: {st: Date.now(), sh: 0, a: [], ids: set.map(s => s.id)}}}); }
  else if (typeof day.sh === "number" && day.sh >= a.length && a.length < 10) {
    // question was on screen when the player left: count it as a timeout
    a.push({c: -1, ok: false, ms: QTIME, p: 0, b: 0});
    await meDoc().update({days: {[k]: {a}}});
  }
  S.play = {key: k, set, a, i: a.length, fb: null};
  if (S.play.i >= 10) return finish();
  showQuestion();
}
async function showQuestion(){
  const P = S.play; P.t0 = performance.now(); P.picked = null; P.fb = null; P.locked = false;
  S.view = "play"; render();
  try { await meDoc().update({days: {[P.key]: {sh: P.i}}}); } catch(e){}
  clearInterval(P.timer);
  P.timer = setInterval(() => {
    const left = Math.max(0, QTIME - (performance.now() - P.t0));
    const bar = document.getElementById("cbar"), num = document.getElementById("cnum");
    if (bar) { bar.style.width = (left / QTIME * 100) + "%"; bar.parentNode.classList.toggle("low", left < 5000); }
    if (num) num.textContent = Math.ceil(left / 1000);
    if (left <= 0) answer(-1);
  }, 100);
}
async function answer(k){
  const P = S.play; if (!P || P.locked) return;
  P.locked = true; clearInterval(P.timer);
  const ms = Math.min(QTIME, Math.round(performance.now() - P.t0));
  const slot = P.set[P.i];
  const ok = k >= 0 && slot.order[k] === 0;
  let run = 0; for (let j = P.a.length - 1; j >= 0 && P.a[j].ok; j--) run++;
  const pts = points(ok, ms, ok && P.key < GH_NOCOMBO ? run + 1 : 0);
  const rec = {c: k, ok, ms: k < 0 ? QTIME : ms, p: pts.p, b: pts.b};
  P.a.push(rec); P.picked = k; P.fb = rec;
  render();
  const done = P.a.length >= 10;
  const t = tally(P.a);
  const patch = {days: {[P.key]: {a: P.a, sc: t.sc, n: t.n}}};
  if (done) { patch.days[P.key].done = true; patch.days[P.key].fin = Date.now(); }
  try { await meDoc().update(patch); } catch(e){ toast("Couldn't save that answer — check your connection."); }
  setTimeout(() => { if (done) finish(); else { P.i++; showQuestion(); } }, 1300);
}
function finish(){ if (S.play) clearInterval(S.play.timer); S.play = null; S.view = "result"; S.shareOpen = false; render(); }

// ---------- rendering ----------
function render(){
  const f = document.activeElement && document.activeElement.id;
  let h = header();
  if (!S.ready) h += '<div class="card note">Waking up…</div>';
  else if (S.failed) h += failCard();
  else if (!S.loaded) h += '<div class="card note">Loading today\'s scores…</div>';
  else if (!me() || !me().name || S.view === "profile") h += profileView();
  else if (S.view === "play" && S.play) h += playView();
  else if (S.view === "result") h += resultView();
  else if (S.view === "admin" && S.owner) h += adminView();
  else h += homeView();
  $app.innerHTML = h;
  if (f) { const el = document.getElementById(f); if (el) el.focus(); }
  const nm = document.getElementById("in-name"); if (nm) nm.oninput = e => { S.edit.name = e.target.value; };
}
window.addEventListener("gh-rerender", () => { try { if (S.view !== "play") render(); } catch (e) {} });
// The mark: what the player thinks they are worth (10) against their real average. Runs down once, on first paint.
function ghMarkRun(){
  const D = 1500, t = Math.min(1, (Date.now() - window.GH_T0) / D), e = 1 - Math.pow(1 - t, 3);
  const el = document.querySelector(".mast .mtm[data-v]");
  if (el) { const v = +el.getAttribute("data-v"), cur = 10 - (10 - v) * e; el.style.setProperty("--p", (cur * 10) + "%"); const n = el.querySelector(".mk b"); if (n) n.textContent = cur.toFixed(1); }
  if (t < 1) requestAnimationFrame(ghMarkRun);
}
function ghMark(m){
  // Marked to market = today's average correct answers across everyone who has finished today's set.
  const k = S.key, P = Object.values(S.players || {});
  let n = 0, s = 0; P.forEach(p => { const d = p.days && p.days[k]; if (d && d.done && typeof d.n === "number") { n++; s += d.n; } });
  const mine = m && m.days && m.days[k] && m.days[k].done && typeof m.days[k].n === "number" ? m.days[k].n : null;
  const top = '';
  if (!n) return '<div class="mtm">' + top + '<div class="row mk"><span>Marked to market</span><em>no trades yet today</em></div></div>';
  const v = Math.round(s / n * 10) / 10;
  try { if (!window.GH_T0 && window.requestAnimationFrame && !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) { window.GH_T0 = Date.now(); requestAnimationFrame(ghMarkRun); } } catch (e) {}
  const you = mine === null ? '' : '<i class="you" style="left:' + (mine * 10) + '%" title="You today: ' + mine + '/10"></i>';
  const sub = 'today\'s average across ' + n + (n === 1 ? ' player' : ' players') + (mine === null ? '' : ' · you: ' + mine + '/10');
  return '<div class="mtm" data-v="' + v + '" style="--p:' + (v * 10) + '%">' + top + '<div class="row mk"><span>Marked to market <small>' + sub + '</small></span><b>' + v.toFixed(1) + '</b></div><div class="scale"><i class="dot"></i>' + you + '</div></div>';
}
function header(){
  const m = me(); const st = m ? streak(m.days || {}, S.key) : 0;
  const right = (S.owner && m && m.name && S.view !== "play" ? '<button class="gear" data-a="admin" title="Organiser tools">⚙️</button>' : '') + (m && m.name && S.view !== "play" ? '<button class="me" data-a="profile">' + esc(m.name) + (st ? '<br><span class="fire">🔥 ' + st + '</span>' : '') + '</button>' : '');

const GH_TAUNTS = ["Still long yourself?", "Your desk can see the leaderboard. No pressure.", "Twenty seconds a question. No calling a broker.", "Confidence is not a fundamental.", "Yesterday's close has been noted.", "Go on. Take the position.", "You can't hedge this one.", "Ten questions. Your mark moves either way.", "The leaderboard has a long memory.", "Everyone's a ten until the set opens.", "Loud on the desk. Quiet on the leaderboard?", "Price discovery starts when you press Play."];
function ghTaunt(){ const k = S.key || ""; let n = 0; for (const c of k) n = (n * 31 + c.charCodeAt(0)) % 9973; return GH_TAUNTS[n % GH_TAUNTS.length]; }
function ghVerdict(n){ return n >= 10 ? "Ten out of ten. For once, the self-estimate was the right price." : n >= 8 ? "Strong book. One or two positions you'd rather not discuss." : n >= 5 ? "Flat on the day. Nobody got hurt, nobody got a bonus." : n >= 2 ? "Deep contango: your knowledge is worth more in the future." : "Wide of the market. Tell the desk the Wi-Fi dropped."; }

const GH_NOCOMBO = "2026-11-28";
function failCard(){

}
function profileView(){
  const m = me();

  let h = '<div class="card"><b>' + (m && m.name ? "Your profile" : "Welcome! Set up your player") + '</b>';
  h += '<label class="f">Display name</label><input class="in" id="in-name" maxlength="24" placeholder="e.g. Bader N." value="' + esc(S.edit.name) + '">';
  h += '<label class="f">Team</label><div class="chips">' + DEPTS.map(d => '<button class="chip ' + (S.edit.dept === d ? "on" : "") + '" data-a="dept" data-v="' + d + '">' + d + '</button>').join("") + '</div>';
  h += '<div style="height:14px"></div><button class="btn" data-a="save-profile">' + (m && m.name ? "Save" : "Let's go") + '</button>';
  if (m && m.name) h += '<button class="btn ghost" data-a="home">Cancel</button>';
  h += '</div>';
  if (!(m && m.name)) h += rulesCard(true);
  return h;
}
function rulesCard(open){
  return '<details class="card"' + (open ? " open" : "") + '><summary>How it works</summary><ul class="rules">' +
    '<li>Everyone gets the same <b>10 questions</b> each day: 4 easy, 4 medium, 2 hard. A new set drops at <b>midnight London time</b>.</li>' +
    '<li>You have <b>20 seconds</b> per question and <b>one attempt per day</b>. Leaving mid-question counts as a timeout.</li>' +
    '<li>A correct answer scores <b>500–1,000</b>; the faster you answer, the more you get. Wrong answers score 0, so don\'t guess blindly.</li>' +
    (S.key < GH_NOCOMBO ? '<li><b>Combo bonus:</b> +100 for each consecutive correct answer after the first, up to +400 per question.</li>' : '') +
    '<li>Answers and explanations appear when you finish. Please don\'t share answers before midnight!</li>' +
    '<li>Keep your <b>🔥 streak</b> going by playing every day. You get one free missed day per week.</li></ul></details>';
}
function homeView(){
  const m = me(), k = S.key, d = (m.days || {})[k], B = boards(Object.values(S.players), k), mineRow = B.rows.find(r => r.id === S.uid);
  let h = '<div class="card hero"><div class="day">#' + dayNum(k) + ' · ' + new Date(k + "T12:00:00Z").toLocaleDateString("en-GB", {weekday: "long", day: "numeric", month: "long"}) + '</div>';
  if (d && d.done) {
    const t = tally(d.a), rank = B.today.findIndex(r => r.id === S.uid) + 1;
    h += '<h2>' + fmt(t.sc) + ' pts</h2><div class="note" style="color:#e8d9cf">' + t.n + '/10 correct · ranked <b>' + rank + '</b> of ' + B.today.length + ' today</div>';
    h += '<div class="kpis"><div class="kpi"><b class="fire">' + (mineRow.streak || 0) + '</b><span>day streak</span></div><div class="kpi"><b>' + fmt(mineRow.best) + '</b><span>best</span></div><div class="kpi"><b>' + fmt(mineRow.avg) + '</b><span>average</span></div></div>';
    h += '<div style="height:12px"></div><button class="btn" data-a="result">See answers &amp; share</button>';
    h += '<div class="note center" style="margin-top:10px;text-align:center">Next set in <span class="count" id="cd">' + countdown() + '</span></div>';
  } else {
    h += '<h2>' + (d ? "Finish today's set" : "Today's set is live") + '</h2><div class="note" style="color:#e8d9cf">10 questions · 20 seconds each · ' + B.today.length + ' played so far' + (B.inProgress ? ', ' + B.inProgress + ' in progress' : '') + '</div>';
    if (mineRow && mineRow.played) h += '<div class="kpis"><div class="kpi"><b class="fire">' + mineRow.streak + '</b><span>day streak</span></div><div class="kpi"><b>' + fmt(mineRow.best) + '</b><span>best</span></div><div class="kpi"><b>' + fmt(mineRow.avg) + '</b><span>average</span></div></div>';
    h += '<p class="taunt">' + esc(ghTaunt()) + '</p><button class="btn" data-a="play">' + (d ? "Resume" : "Play") + '</button>';
    h += '<div class="note" style="margin-top:10px;text-align:center">Closes in <span class="count" id="cd">' + countdown() + '</span></div>';
  }
  h += '</div>';
  if (S.owner) h += ownerBar();
  h += boardsCard(B, d && d.done);
  h += rulesCard(false);
  return h;
}
function ownerBar(){
  let h = '<div class="ownerbar">';
  if (testing()) h += '<div class="testtag">🧪 Testing mode is on</div><button class="btn" data-a="testfresh">🔁 New questions &amp; replay</button>';
  h += '<button class="btn sec" data-a="admin">Organiser tools</button></div>';
  return h;
}
function boardsCard(B, showToday){
  const tabs = [["today","Today"],["week","7 days"],["all","All-time"],["teams","Teams"]];
  let h = '<div class="card"><div class="tabs">' + tabs.map(t => '<button class="' + (S.tab === t[0] ? "on" : "") + '" data-a="tab" data-v="' + t[0] + '">' + t[1] + '</button>').join("") + '</div>';
  const medal = i => i === 0 ? '<span class="medal">🥇</span>' : i === 1 ? '<span class="medal">🥈</span>' : i === 2 ? '<span class="medal">🥉</span>' : (i + 1);
  const fire = r => r.streak >= 2 ? ' <span class="fire">🔥' + r.streak + '</span>' : '';
  let rows = [];
  if (S.tab === "today") {
    if (!B.today.length) return h + '<div class="note">Nobody has finished today yet. Be the first!</div></div>';
    rows = B.today.slice(0, 50).map((r, i) => '<tr class="' + (r.id === S.uid ? "mine" : "") + '"><td class="rk">' + medal(i) + '</td><td><span class="nm">' + esc(r.name) + fire(r) + '</span><span class="sub">' + esc(r.dept) + ' · ' + r.today.n + '/10 · ' + (r.today.ms / 1000).toFixed(1) + 's</span></td><td class="sc">' + fmt(r.today.sc) + '</td></tr>');
  } else if (S.tab === "week") {
    if (!B.week.length) return h + '<div class="note">No scores in the last 7 days yet.</div></div>';
    rows = B.week.slice(0, 50).map((r, i) => '<tr class="' + (r.id === S.uid ? "mine" : "") + '"><td class="rk">' + medal(i) + '</td><td><span class="nm">' + esc(r.name) + fire(r) + '</span><span class="sub">' + esc(r.dept) + ' · ' + r.weekPlayed + '/7 days played</span></td><td class="sc">' + fmt(r.week) + '</td></tr>');
  } else if (S.tab === "all") {
    if (!B.all.length) return h + '<div class="note">No scores yet.</div></div>';
    rows = B.all.slice(0, 50).map((r, i) => '<tr class="' + (r.id === S.uid ? "mine" : "") + '"><td class="rk">' + (r.played >= 3 ? medal(i) : "–") + '</td><td><span class="nm">' + esc(r.name) + fire(r) + '</span><span class="sub">' + r.played + ' days · best ' + fmt(r.best) + (r.played < 3 ? ' · ranks after 3 days' : '') + '</span></td><td class="sc">' + fmt(r.avg) + '<span class="sub" style="text-align:right">avg</span></td></tr>');
  } else {
    rows = B.teams.map((t, i) => '<tr><td class="rk">' + medal(i) + '</td><td><span class="nm">' + esc(t.dept) + '</span><span class="sub">' + t.players + ' players · ' + t.todayN + ' played today · 7-day avg ' + fmt(t.weekAvg) + '</span></td><td class="sc">' + fmt(t.todayAvg) + '<span class="sub" style="text-align:right">today avg</span></td></tr>');
  }
  return h + '<table class="lb">' + rows.join("") + '</table></div>';
}
function playView(){
  const P = S.play, slot = P.set[P.i], q = QBY[slot.id];
  let h = '<div class="dots">' + Array.from({length: 10}, (_, i) => '<i class="' + (i < P.a.length ? (P.a[i].ok ? "ok" : "no") : i === P.i ? "cur" : "") + '"></i>').join("") + '</div>';
  h += '<div class="card"><div class="qmeta"><span>Question ' + (P.i + 1) + ' of 10 · ' + esc(DCATS[q[2]]) + '</span><span class="lvl l' + q[1] + '">' + LVL[q[1]] + '</span></div>';
  if (!P.fb) {
    const left = Math.max(0, QTIME - (performance.now() - P.t0));
    h += '<div class="clock"><div class="bar' + (left < 5000 ? " low" : "") + '"><i id="cbar" style="width:' + (left / QTIME * 100) + '%"></i></div><b id="cnum">' + Math.ceil(left / 1000) + '</b></div>';
  }
  h += '<div class="q">' + esc(q[3]) + '</div>';
  h += slot.order.map((oi, k) => '<button class="opt' + (P.picked === k ? " pick" : "") + '" ' + (P.fb ? "disabled" : 'data-a="ans" data-v="' + k + '"') + '><span class="l">' + LET[k] + '</span><span>' + esc(q[4][oi]) + '</span></button>').join("");
  if (P.fb) {
    const r = P.fb;
    h += r.ok ? '<div class="fb ok">✓ +' + fmt(r.p) + '<small>' + (r.ms / 1000).toFixed(1) + 's' + (r.b ? ' · combo +' + r.b : '') + '</small></div>'
              : '<div class="fb no">' + (r.c < 0 ? "⏱ Time's up" : "✗ Not this time") + '<small>Answers revealed at the end</small></div>';
  }
  h += '</div><div class="note" style="text-align:center">Score so far: <b>' + fmt(tally(P.a).sc) + '</b></div>';
  return h;
}
function shareText(day, k){
  const t = tally(day.a), st = streak(me().days || {}, k);
  const grid = day.a.map(x => !x.ok ? "🟥" : x.ms <= 8000 ? "🟩" : "🟨").join("");
  return "Crude Awakening #" + dayNum(k) + " 🛢️\n" + t.n + "/10 · " + fmt(t.sc) + " pts" + (st >= 2 ? " · 🔥" + st : "") + "\n" + grid.slice(0, 10);
}
function resultView(){
  const k = S.key, m = me(), d = (m.days || {})[k];
  if (!d || !d.done) { S.view = "home"; return homeView(); }
  const t = tally(d.a), set = setFor(d, k), B = boards(Object.values(S.players), k), rank = B.today.findIndex(r => r.id === S.uid) + 1;
  const others = Object.values(S.players).map(p => p.days && p.days[k]).filter(x => x && x.done && sameSet(x, d, k));
  const pct = i => { const n = others.length || 1; return Math.round(others.filter(x => x.a[i] && x.a[i].ok).length / n * 100); };
  let h = '<div class="card hero" style="text-align:center"><div class="day">Crude Awakening #' + dayNum(k) + '</div><div class="big" style="margin:8px 0 2px">' + fmt(t.sc) + '</div><div class="note" style="color:#e8d9cf">' + t.n + '/10 correct · #' + rank + ' of ' + B.today.length + ' today</div><p class="verdict">' + esc(ghVerdict(t.n)) + '</p>';
  h += '<div class="grid">' + d.a.map(x => !x.ok ? "🟥" : x.ms <= 8000 ? "🟩" : "🟨").join("") + '</div>';
  h += '<button class="btn" data-a="share">Copy result to share</button>';
  if (S.shareOpen) h += '<textarea class="share" readonly>' + esc(shareText(d, k)) + '</textarea><div class="note">Copy this and paste it into your team chat.</div>';
  h += '</div>' + boardsCard(B, true);
  if (S.owner) h += ownerBar();
  // most missed
  if (others.length >= 2) {
    let worst = 0; for (let i = 1; i < 10; i++) if (pct(i) < pct(worst)) worst = i;
    const wq = QBY[set[worst].id];
    h += '<div class="missed"><b>What most people missed:</b> Q' + (worst + 1) + ', with only ' + pct(worst) + '% right. ' + esc(wq[3]) + ' <b>' + esc(wq[4][0]) + '</b>.</div>';
  }
  h += '<div class="card">';
  set.forEach((s, i) => {
    const q = QBY[s.id], a = d.a[i] || {c: -1, ok: false, ms: QTIME, p: 0};
    const yours = a.c >= 0 ? q[4][s.order[a.c]] : "No answer";
    h += '<div class="rev"><div class="h"><span>Q' + (i + 1) + ' · ' + LVL[q[1]] + '</span><span>' + (a.ok ? "+" + fmt(a.p) + " · " + (a.ms / 1000).toFixed(1) + "s" : "0") + '</span></div><div class="qq">' + esc(q[3]) + '</div>';
    h += a.ok ? '<div class="a ok">✓ ' + esc(q[4][0]) + '</div>' : '<div class="a no">✗ ' + esc(yours) + '</div><div class="a ok">✓ ' + esc(q[4][0]) + '</div>';
    h += '<div class="e">' + esc(q[5]) + '</div>';
    if (others.length >= 2) h += '<div class="pct" title="' + pct(i) + '% right"><i style="width:' + pct(i) + '%"></i></div><div class="note" style="font-size:11.5px">' + pct(i) + '% of players got this right</div>';
    h += S.flagged[s.id] ? '<div class="note">Flagged. Thanks!</div>' : '<button class="flag" data-a="flag" data-v="' + s.id + '">Report a problem with this question</button>';
    h += '</div>';
  });
  h += '</div>';
  if (S.owner) h += ownerBar();
  return h;
}
function adminView(){
  const MIXLBL = {standard: ["Standard", "4 easy · 4 medium · 2 hard"], hard: ["Hard", "4 medium · 6 hard"], expert: ["Expert", POOLS[0].length ? "1 medium · 6 hard · 3 specialist" : "1 medium · 9 hard"]};
  let h = '<div class="card adm"><b>Difficulty</b><div class="mixes">';
  Object.keys(MIXLBL).forEach(m => { h += '<button class="mix' + (MIXNAME === m ? ' on' : '') + '" data-a="setmix" data-v="' + m + '"><b>' + MIXLBL[m][0] + '</b><span>' + MIXLBL[m][1] + '</span></button>'; });
  h += '</div><p class="note">Applies to everyone from tomorrow\'s set. In testing mode, <b>New questions &amp; replay</b> uses it straight away.</p></div>';
  h += '<div class="card adm"><b>Testing</b><label class="tog"><input type="checkbox" data-a="testtoggle"' + (S.cfg.testing ? " checked" : "") + '> <span>Testing mode</span></label>';
  h += '<p class="note">While it\'s on, you get a <b>New questions &amp; replay</b> button on the home and results screens. It replaces <b>today\'s</b> 10 questions for everyone with unused ones and resets your own play. Anyone who already played keeps their score and answer review. Turn it off before launch.</p>';
  if (S.cfg.testing) h += '<button class="btn" data-a="testfresh">🔁 New questions &amp; replay</button>';
  const d0 = me() && me().days && me().days[S.key];
  if (d0) h += '<button class="btn sec" data-a="resetme">Replay today\'s same questions</button>';
  h += '</div>';
  h += '<div class="card adm"><b>Organiser tools</b><p class="note">Only you can see this. Preview upcoming sets, swap any question, and review flags. Players can\'t see answers ahead of time unless they dig into the page code, so don\'t use it for prizes.</p>';
  const c = {1: POOLS[1].length, 2: POOLS[2].length, 3: POOLS[3].length};
  const fresh = Math.min(Math.floor(c[1] / 4), Math.floor(c[2] / 4), Math.floor(c[3] / 2));
  h += '<div class="note">Question bank: ' + c[1] + ' easy · ' + c[2] + ' medium · ' + c[3] + ' hard. Fresh sets until about <b>' + new Date(Date.parse(addDays(LAUNCH, fresh - 1) + "T12:00:00Z")).toLocaleDateString("en-GB", {day: "numeric", month: "short"}) + '</b>; after that, questions start repeating.</div>';
  for (let off = 0; off < 7; off++) {
    const k = addDays(S.key, off), set = todaySet(k);
    h += '<details class="d"' + (off === 1 ? " open" : "") + '><summary>#' + dayNum(k) + ' · ' + k + (off === 0 ? " (today)" : off === 1 ? " (tomorrow)" : "") + (S.sched[k] ? " · edited" : "") + '</summary>';
    set.forEach((s, i) => { const q = QBY[s.id]; h += '<div class="it"><span class="lvl l' + q[1] + '">' + LVL[q[1]][0] + '</span><span class="t">' + esc(q[3]) + '<br><b>' + esc(q[4][0]) + '</b></span>' + (off > 0 ? '<button class="sw" data-a="swap" data-v="' + k + '|' + i + '">Swap</button>' : '') + '</div>'; });
    h += '</details>';
  }
  h += '</div>';
  const byQ = {}; S.flags.forEach(f => { (byQ[f.qid] = byQ[f.qid] || []).push(f); });
  h += '<div class="card adm"><b>Flagged questions</b>';
  const ks = Object.keys(byQ);
  if (!ks.length) h += '<div class="note">No flags yet.</div>';
  ks.forEach(id => { const q = QBY[id]; if (!q) return; h += '<div class="it"><span class="t">' + esc(q[3]) + '<br><b>' + esc(q[4][0]) + '</b><br><span class="note">' + byQ[id].length + ' flag(s)</span></span><button class="sw" data-a="clearflag" data-v="' + id + '">Clear</button></div>'; });
  h += '</div>';
  h += '<button class="btn ghost" data-a="home">Back</button>';
  return h;
}

// ---------- events ----------
$app.addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
  const a = b.dataset.a, v = b.dataset.v;
  switch (a) {
    case "home": S.view = "home"; S.edit = null; break;
    case "profile": S.view = "profile"; S.edit = null; break;
    case "dept": S.edit.dept = v; break;
    case "save-profile": {
      const name = (S.edit.name || "").trim().slice(0, 24);
      if (!name) return toast("Pick a display name.");
      if (!S.edit.dept) return toast("Pick your team.");
      { const nk = x => String(x || "").toLowerCase().replace(/[^a-z0-9]/g, "");
        const clash = Object.values(S.players).find(p => p.id !== S.uid && p.name && nk(p.name) === nk(name));
        if (clash) { const t = document.createElement("div"); t.className = "toast"; t.style.maxWidth = "340px"; t.textContent = "“" + clash.name + "” is already playing. If that's you, use “Play on another phone or computer” at the bottom of the page to link this device. Otherwise pick a different name."; document.body.appendChild(t); setTimeout(() => t.remove(), 7000); return; } }
      try { await saveMe({name, dept: S.edit.dept}); } catch(e){ return; }
      S.view = "home"; S.edit = null; break;
    }
    case "tab": S.tab = v; break;
    case "play": try { await startPlay(); } catch(e){} return;
    case "ans": answer(+v); return;
    case "result": S.view = "result"; S.shareOpen = false; break;
    case "share": {
      const d = me().days[S.key]; const txt = shareText(d, S.key);
      try { await navigator.clipboard.writeText(txt); toast("Copied! Paste it into your team chat."); S.shareOpen = false; }
      catch(e){ S.shareOpen = true; }
      break;
    }
    case "flag":
      S.flagged[v] = true;
      try { await S.db.collection("flags").add({qid: v, day: S.key, at: Date.now()}); } catch(e){}
      break;
    case "admin": S.view = "admin"; break;
    case "testtoggle": {
      const on = !S.cfg.testing;
      try { await S.db.doc("config/settings").set(Object.assign({}, S.cfg, {testing: on})); S.cfg.testing = on; toast(on ? "Testing mode on." : "Testing mode off."); } catch(e){ toast("Couldn't save the setting."); }
      break;
    }
    case "setmix": {
      const from = addDays(S.key, 1);
      const hist = (Array.isArray(S.cfg.mixHist) && S.cfg.mixHist.length ? S.cfg.mixHist : [[LAUNCH, S.cfg.mix || "standard"]]).filter(x => x[0] < from).concat([[from, v]]);
      try { await S.db.doc("config/settings").set(Object.assign({}, S.cfg, {mix: v, mixHist: hist})); S.cfg.mix = v; S.cfg.mixHist = hist; setMix(v); setMixHistory(hist, v); toast("Difficulty set to " + v + " from tomorrow's set."); } catch(e){ toast("Couldn't save the setting."); }
      break;
    }
    case "testfresh": {
      if (b.dataset.busy) return; b.dataset.busy = "1"; b.textContent = "Loading new questions…";
      await freshTestSet(); break;
    }
    case "swap": {
      const [k, i] = v.split("|"); const set = todaySet(k).map(s => s.id);
      const q = QBY[set[+i]];
      const near = new Set(); for (let o = -45; o <= 45; o++) { const kk = addDays(S.key, o); todaySet(kk).forEach(s => near.add(s.id)); }
      const cands = POOLS[q[1]].filter(id => !near.has(id));
      const pool = cands.length ? cands : POOLS[q[1]].filter(id => !set.includes(id));
      set[+i] = pool[Math.floor(Math.random() * pool.length)];
      try { await S.db.doc("schedule/" + k).set({ids: set, by: S.uid, at: Date.now()}); toast("Swapped."); } catch(e){ toast("Only the organiser can edit sets."); }
      return;
    }
    case "clearflag":
      for (const f of S.flags.filter(f => f.qid === v)) { try { await S.db.doc("flags/" + f.id).delete(); } catch(e){} }
      return;
    case "resetme":
      try { await meDoc().update({days: {[S.key]: null}}); toast("Reset. You can play today again."); } catch(e){ toast("Couldn't reset."); }
      S.view = "home"; break;
  }
  render();
});
})();
</script>
